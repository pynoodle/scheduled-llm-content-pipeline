name: 1. Daily AI Summary (8:00 AM)

on:
  schedule:
    # 매일 오전 8시 (KST) = UTC 전날 23시
    - cron: '0 23 * * *'
  workflow_dispatch:

env:
  TZ: 'Asia/Seoul'

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}
        NOTION_DB_ID=${{ secrets.NOTION_DB_ID }}
        ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY }}
        EOF
    
    - name: Generate AI News Summary
      run: |
        echo "=== [8:00 AM] Collecting news and generating summary ==="
        python run_insightlens_ai_only.py
    
    - name: Upload summary files
      uses: actions/upload-artifact@v4
      with:
        name: summary-files
        path: |
          summary_*.txt
          sources_*.json
        retention-days: 1  # 1일만 보관 (다음 단계에서 사용)
    
    - name: Commit summary to repository
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        
        DATE=$(date +%Y-%m-%d)
        git add summary_${DATE}.txt sources_${DATE}.json
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily AI summary - ${DATE} [8:00 AM]"
          git push
        fi
      continue-on-error: true

