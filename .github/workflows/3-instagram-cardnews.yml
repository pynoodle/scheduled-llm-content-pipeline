name: 3. Instagram Card News (8:15 AM)

on:
  schedule:
    # 매일 오전 8시 15분 (KST) = UTC 전날 23시 15분
    - cron: '15 23 * * *'
  workflow_dispatch:

env:
  TZ: 'Asia/Seoul'

jobs:
  generate-and-upload-cardnews:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Pull latest changes
      run: |
        git pull origin main
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        EOF
    
    - name: Generate Instagram Card News
      run: |
        echo "=== [8:15 AM] Generating Instagram Card News ==="
        DATE=$(date +%Y-%m-%d)
        
        if [ ! -f "summary_${DATE}.txt" ]; then
          echo "Summary file not found in repository"
          exit 1
        fi
        
        python generate_cardnews.py "summary_${DATE}.txt" --lang en --slides 5
        echo "Card news images generated successfully!"
        echo "Instagram upload will be done locally from your PC"
    
    - name: Upload card news images
      uses: actions/upload-artifact@v4
      with:
        name: instagram-cardnews
        path: |
          cardnews_output/*.png
          cardnews_output/*.txt
        retention-days: 7
    
    - name: Completion notification
      run: |
        echo "============================================"
        echo "Daily AI Content Automation Complete!"
        echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "============================================"
        echo "Generated:"
        echo "  - AI Summary (8:00 AM)"
        echo "  - YouTube Shorts (8:10 AM)"
        echo "  - Instagram Card News Images (8:15 AM)"
        echo "============================================"
        echo "Local tasks (automated on your PC):"
        echo "  - YouTube upload (8:20 AM)"
        echo "  - Instagram upload (8:25 AM)"
        echo "============================================"

